<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Game of Life</title>
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      body {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: Arial, Helvetica, sans-serif;
      }
      div {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 1rem;
      }
      .row {
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 2rem;
      }
      .col {
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
      }
    </style>
  </head>
  <body>
    <noscript>This page contains webassembly and javascript content, please enable javascript in your browser.</noscript>
    <div class="col">
      <div class="row">
        <div class="col">
          <label for="alive-color">Alive color</label>
          <input type="color" id="alive-color" value="#051118" />
        </div>
        <div class="col">
          <label for="dead-color">Dead color</label>
          <input type="color" id="dead-color" value="#F8F7F4" />
        </div>
        <div class="col">
          <label for="grid-color">Grid color</label>
          <input type="color" id="grid-color" value="#F8F7F4" />
        </div>
      </div>
      <canvas id="game-of-life"></canvas>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
